name = "daily-brief"
main = "worker.js"
compatibility_date = "2026-09-01"
# Keep any variables set in the Cloudflare dashboard when deploying.
keep_vars = true

# Everything in public/ is served as a static file; /api/* falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/oauth/*", "/pallets/read", "/pallets/sync", "/trader/news", "/trader/status"]

# Where the daily briefs are kept (your BRIEFS namespace; the id is not a secret).
[[kv_namespaces]]
binding = "BRIEFS"
id = "515698f8ff3d4ec6b026dc5f179d69aa"

# "Add to list" talks to your Grocerylist worker directly. It must be deployed
# in the same Cloudflare account under the name "grocerylist".
[[services]]
binding = "GROCERY"
service = "grocerylist"

# Secrets, set by `npm run setup` (never put them in this file):
#   BRIEF_KEY     unlocks the app and lets the morning run send the brief
#   GROCERY_CODE  the 20-letter code on Grocerylist's Share tab

# Public ids for the Stats tab's Instagram connection (Meta app "BabyLog Stats",
# Facebook Login for Business configuration). Not secrets; IG_APP_SECRET is a secret.
[vars]
IG_APP_ID = "1876152856717996"
IG_CONFIG_ID = "1895911921565221"
IG_USER_ID = "17841426600007858"
# Day trader news check (/trader/news): only this Alpaca account's keys may use it. Not a secret.
TRADER_ACCOUNT = "PA3NXVMDP"

# Pallet Router reads the address off receipt photos with Workers AI (free daily allowance).
[ai]
binding = "AI"

# Pallet Router sharing: one Durable Object per 6-digit code (SQLite storage, free plan).
[[durable_objects.bindings]]
name = "PALLET_ROOMS"
class_name = "PalletRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PalletRoom"]

# Crypto paper bot (src/cryptobot.js): one Durable Object keeps the pretend portfolios.
[[durable_objects.bindings]]
name = "CRYPTO_BOT"
class_name = "CryptoBot"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CryptoBot"]

# Meme hunter every 10 minutes; coin breakout once a day just after the daily candle closes.
# (Cloudflare cron triggers, free plan. GitHub Actions schedules proved unreliable.)
[triggers]
crons = ["*/10 * * * *", "7 0 * * *"]
