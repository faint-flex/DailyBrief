<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}</style></head><body>
<canvas id="c"></canvas>
<script src="../sim.js"></script><script src="../draw.js"></script>
<script src="../vendor/three.min.js"></script><script src="../vendor/sky.js"></script><script src="../world3d.js"></script><script src="../3d-rocket.js"></script><script src="../3d-env.js"></script><script src="../3d-earth.js"></script><script src="../3d-fx.js"></script>
<script>
// ?scene=launch|pad|barge|catch  ?cam=tpl|low|chase|high|wide|east  ?alt=km  ?fire=1
const A=window.APOGEE_3D, T=window.THREE;
const q=new URLSearchParams(location.search); const alt=+(q.get('alt')||0);
const scn=q.get('scene')||'launch', camMode=q.get('cam')||(alt>1?'high':'tpl');
A.init(document.getElementById('c')); A.resize();
const design={id:'d1',name:'Test',color:'#ff7a1a',stages:[{engine:'comet',count:9,prop:400},{engine:'cometv',count:1,prop:100}]};
const sc=new T.Scene(); A.lights(sc,new T.Vector3(0,0,0));
const geo=window.APOGEE_DRAW.geometry(design,{});
const rk=A.buildRocket(design,{},{fins:true,legs:true});
let sea=null, base=0, arms=null;
if(scn==='launch'){ const s=A.launchSite(sc,geo); sea=s.sea; base=s.padTop; }
else if(scn==='pad'){ const p=A.padModel(); sc.add(p.group); base=p.deckY; }
else if(scn==='barge'){ sea=A.ocean(400000); sc.add(sea); const b=A.bargeModel(); sc.add(b.group); base=b.deckY; }
else if(scn==='catch'){ const armY=geo.stages[0].h*0.9; const c=A.catchModel(geo,armY); sc.add(c.group); arms=c.arms; base=8; }
rk.root.position.y=base; sc.add(rk.root);
const cam=A.R.camera; const H=geo.total;
const cams={
  tpl:()=>{cam.position.set(60,25,120); cam.lookAt(0,30,0);},
  low:()=>{cam.position.set(140,3,230); cam.lookAt(0,H*0.45,0);},
  sun:()=>{cam.position.set(330,20,-560); cam.lookAt(0,45,0);},
  sea:()=>{cam.position.set(0,30,560); cam.lookAt(-400,0,3000);},
  east:()=>{cam.position.set(-90,6,-230); cam.lookAt(0,H*0.4,0);},
  wide:()=>{cam.position.set(-420,90,-520); cam.lookAt(0,20,0);},
  chase:()=>{cam.position.set(-500,2000,-900); cam.lookAt(0,0,0);},
  high:()=>{cam.position.set(0,alt*1000,-3000); cam.lookAt(0,0,30000);},
};
(cams[camMode]||cams.tpl)();
let t=0; function f(){t+=1/60; if(arms) for(const a of arms) a.pivot.rotation.y=a.s*0.55*(q.get('closed')?0:1);
 A.setPlume(rk.stages[0], q.get('fire')?1:0, 0.2, t); A.render(sc,{alt}); window.frames_=(window.frames_||0)+1; requestAnimationFrame(f);} f();
</script></body></html>
