<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX test</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;text-shadow:0 1px 2px #000}</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<script src="../sim.js"></script><script src="../draw.js"></script>
<script src="../vendor/three.min.js"></script><script src="../vendor/sky.js"></script><script src="../world3d.js"></script><script src="../3d-rocket.js"></script><script src="../3d-env.js"></script><script src="../3d-earth.js"></script><script src="../3d-fx.js"></script>
<script>
// ?mode=launch|explode|land|climb|vent  &t=<seconds to pre-simulate>  &alt=<km for climb>
const A=window.APOGEE_3D, T=window.THREE;
const q=new URLSearchParams(location.search); const mode=q.get('mode')||'launch'; const T0=+(q.get('t')||6);
A.init(document.getElementById('c')); A.resize();
const design={id:'d1',name:'Test',color:'#ff7a1a',stages:[{engine:'comet',count:9,prop:400},{engine:'cometv',count:1,prop:100}]};
const sc=new T.Scene(); A.lights(sc,new T.Vector3(0,0,0));
const geo=window.APOGEE_DRAW.geometry(design,{}); const site=A.launchSite(sc,geo);
const rk=A.buildRocket(design,{},{fins:true,legs:true});
const padTop=site.padTop||0; rk.root.position.y=padTop; sc.add(rk.root);
const fx=APOGEE_FX3D.create(sc);
const cam=A.R.camera; const down=new T.Vector3(0,-1,0); const nozzle=new T.Vector3();
let t=0, altKm=0, exploded=false;
function sim(dt){
  t+=dt;
  if(mode==='launch'){
    const p=Math.min(1,Math.max(0,(t-0.5)/1.5)); const tl=Math.max(0,t-2.2);
    rk.root.position.y=padTop+0.5*14*tl*tl; altKm=(rk.root.position.y-padTop)/1000;
    nozzle.copy(rk.root.position); fx.exhaust(nozzle,down,p,altKm,rk.r,dt,2);
    A.setPlume(rk.stages[0],p,0.2,t);
    cam.position.set(+(q.get('cx')||230),+(q.get('cy')||30),+(q.get('cz')||300)); cam.lookAt(0,40+rk.root.position.y*0.5,0);
  } else if(mode==='climb'){
    altKm=+(q.get('alt')||12); const v=+(q.get('v')||900);
    rk.root.position.set(0,altKm*1000+v*t,0); altKm=rk.root.position.y/1000;
    const d=new T.Vector3(0.15,-1,0).normalize(); rk.root.rotation.z=0.15;
    nozzle.copy(rk.root.position); fx.exhaust(nozzle,d,1,altKm,rk.r,dt,0); A.setPlume(rk.stages[0],1,Math.min(1,altKm/30),t);
    const D=+(q.get('cd')||700); cam.position.copy(rk.root.position).add(new T.Vector3(D*0.3,-D*0.45,D)); cam.lookAt(rk.root.position.x,rk.root.position.y-D*0.6,0);
  } else if(mode==='explode'){
    rk.root.visible=false;
    if(!exploded&&t>0.2){fx.explode(new T.Vector3(0,90,0),+(q.get('size')||30),2);exploded=true;}
    cam.position.set(260,60,380); cam.lookAt(0,110,0);
  } else if(mode==='land'){
    const h=Math.max(0,70*(1-t/5.5)); rk.root.position.y=padTop+h; A.setLegs&&A.setLegs(rk.stages[0],1);
    const p=h>0?0.75:0; nozzle.copy(rk.root.position);
    fx.landingBurn(nozzle,down,p,2,dt,{radius:rk.r,water:q.get('water')==='1'}); A.setPlume(rk.stages[0],p,0.2,t);
    cam.position.set(110,25,160); cam.lookAt(0,20,0);
  } else if(mode==='vent'){
    rk.root.position.y=padTop+40; altKm=+(q.get('alt')||0); fx.setAlt(altKm);
    if(t<3) fx.vent(new T.Vector3(rk.r,rk.root.position.y+40,0),new T.Vector3(1,0,0),dt);
    if(t>1&&t<1+dt*1.5) fx.sonic(new T.Vector3(0,rk.root.position.y+30,0),rk.r,new T.Vector3(0,0,0));
    cam.position.set(60,60,110); cam.lookAt(0,80,0);
  }
  fx.step(dt,cam);
}
function f(){ sim(1/30); A.render(sc,{alt:altKm}); window.frames_=(window.frames_||0)+1;
  const c=fx.count(); document.getElementById('hud').textContent=mode+' t='+t.toFixed(1)+' alt='+altKm.toFixed(2)+'km smoke '+c.smoke+' fire '+c.fire+' spark '+c.spark;
  requestAnimationFrame(f);}
setTimeout(()=>{const t0=performance.now(); for(let i=0;i<T0*30;i++) sim(1/30); window.presimMs=performance.now()-t0; f();},50);
</script></body></html>
