<canvas id="c"></canvas>

<script>
const A=window.APOGEE_3D, S=window.APOGEE_SIM, T=window.THREE;
const q=new URLSearchParams(location.search); const alt=+(q.get('alt')||0);
A.init(document.getElementById('c')); A.resize();
const design={id:'d1',name:'Test',color:'#ff7a1a',stages:[{engine:'comet',count:9,prop:400},{engine:'cometv',count:1,prop:100}]};

const cam=A.R.camera; cam.position.set(60,25,120); cam.lookAt(0,30,0);
let t=0; function f(){t+=1/60; A.setPlume(rk.stages[0], q.get('fire')?1:0, 0.2, t); A.render(sc,{alt}); window.frames_=(window.frames_||0)+1; requestAnimationFrame(f);} f();
