<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}#i{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace}</style></head><body>
<canvas id="c"></canvas><div id="i"></div>
<script src="../sim.js"></script><script src="../draw.js"></script>
<script src="../vendor/three.min.js"></script><script src="../vendor/sky.js"></script><script src="../world3d.js"></script><script src="../3d-rocket.js"></script><script src="../3d-env.js"></script><script src="../3d-earth.js"></script><script src="../3d-fx.js"></script>
<script>
// ?alt=km  &pitch=deg (0 horizon, -90 straight down)  &yaw=deg (0 = toward sun azimuth)  &ground=1 (show launch site)  &climb=1 (animate alt 0->400)
const A=window.APOGEE_3D, T=window.THREE;
const q=new URLSearchParams(location.search); let alt=+(q.get('alt')||120);
const pitch=+(q.get('pitch')||-10), yaw=+(q.get('yaw')||0);
A.init(document.getElementById('c')); A.resize();
const sc=new T.Scene(); A.lights(sc,new T.Vector3(0,0,0));
if(q.get('ground')){ const design={id:'d1',name:'Test',color:'#ff7a1a',stages:[{engine:'comet',count:9,prop:400},{engine:'cometv',count:1,prop:100}]};
  const geo=window.APOGEE_DRAW.geometry(design,{}); A.launchSite(sc,geo); }
const cam=A.R.camera; cam.position.set(0,10,0);
const sunAz=Math.atan2(A.R.sunDir.x,A.R.sunDir.z);
cam.rotation.order='YXZ'; cam.rotation.set(T.MathUtils.degToRad(pitch), sunAz+Math.PI+T.MathUtils.degToRad(yaw), 0);
let t=0; function f(){t+=1/60; if(q.get('climb')) alt=Math.min(400,(alt||1)*1.01);
  if(q.get('sunI')&&A.R.earth) A.R.earth.uniforms.uSunI.value=+q.get('sunI'); A.render(sc,{alt}); window.frames_=(window.frames_||0)+1;
  document.getElementById('i').textContent='alt '+alt.toFixed(1)+' km  bake '+(A.R.earthBakeMs||0).toFixed(0)+' ms'; requestAnimationFrame(f);} addEventListener("load",()=>setTimeout(f,0));
</script></body></html>
